name: Groq PR Review

on:
  push:
    branches: [main, fix/p0-stability]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m pytest -q 2>&1 | tee /tmp/pytest.txt

      - name: Review with Groq
        id: groq_review
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          git fetch origin "${BASE_REF}" --depth=1
          git diff "origin/${BASE_REF}...HEAD" > /tmp/pr.diff
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          prompt=f'''Review this pull request or repository change for AI-Deal-Guardian as a senior engineer.
Identify correctness bugs, regressions, security issues, missing tests, and violations of the issue scope.
Prioritize actionable findings. If there are no blocking concerns, say APPROVED WITH NO BLOCKERS.
Do not propose changes to production secrets or deployment credentials.

PR TITLE:
{os.environ['PR_TITLE']}

PR BODY:
{os.environ.get('PR_BODY','')}

DIFF:
{Path('/tmp/pr.diff').read_text()[:60000]}

TEST OUTPUT:
{Path('/tmp/pytest.txt').read_text()[-30000:]}
'''
          data=json.dumps({'model':'openai/gpt-oss-120b','messages':[{'role':'system','content':'You are a strict senior code reviewer. Be concise and concrete.'},{'role':'user','content':prompt}],'temperature':0,'max_tokens':10000}).encode()
          req=urllib.request.Request('https://api.groq.com/openai/v1/chat/completions',data=data,headers={'Authorization':f"Bearer {os.environ['GROQ_API_KEY']}",'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=180) as r: review=json.load(r)['choices'][0]['message']['content']
          Path('/tmp/review.md').write_text(review,encoding='utf-8')
          print(review)

      - name: Comment review on PR
        if: github.event_name == 'pull_request' && steps.groq_review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            printf '## Automated Groq review\n\n❌ `pytest -q` failed.\n\n' > /tmp/comment.md
          else
            printf '## Automated Groq review\n\n✅ `pytest -q` passed.\n\n' > /tmp/comment.md
          fi
          cat /tmp/review.md >> /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
