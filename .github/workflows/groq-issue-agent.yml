name: Groq Issue Agent

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot issue and repository
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          excluded={'.git','.venv','venv','__pycache__','.pytest_cache','node_modules'}
          exts={'.py','.html','.css','.js','.json','.yml','.yaml','.md','.txt','.toml','.ini'}
          chunks=[]
          for p in sorted(Path('.').rglob('*')):
              if p.is_file() and not any(x in excluded for x in p.parts) and p.stat().st_size <= 120000 and p.suffix.lower() in exts:
                  try: text=p.read_text(encoding='utf-8')
                  except Exception: continue
                  chunks.append(f'===== FILE: {p} =====\n{text}\n')
          Path('/tmp/repo_snapshot.txt').write_text('\n'.join(chunks),encoding='utf-8')
          Path('/tmp/issue.txt').write_text(f"TITLE: {os.environ.get('ISSUE_TITLE','')}\n\nBODY:\n{os.environ.get('ISSUE_BODY','')}",encoding='utf-8')
          PY
      - name: Ask Groq for patch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          issue=Path('/tmp/issue.txt').read_text(); repo=Path('/tmp/repo_snapshot.txt').read_text()
          prompt=f'''Implement this GitHub Issue in AI-Deal-Guardian using only the supplied repository snapshot.
Return ONLY a unified git diff suitable for git apply, with no markdown fences. Return NO_PATCH if unsafe, unclear, unrelated, or requiring production/secrets changes.
Do not modify workflows, deployment infrastructure, credentials, or secrets. Keep the change focused and preserve tests.

ISSUE:\n{issue}\n\nREPOSITORY:\n{repo}'''
          data=json.dumps({'model':'openai/gpt-oss-120b','messages':[{'role':'system','content':'Output only a unified diff or NO_PATCH.'},{'role':'user','content':prompt}],'temperature':0,'max_tokens':50000}).encode()
          req=urllib.request.Request('https://api.groq.com/openai/v1/chat/completions',data=data,headers={'Authorization':f"Bearer {os.environ['GROQ_API_KEY']}",'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=180) as r: out=json.load(r)['choices'][0]['message']['content'].strip()
          Path('/tmp/patch.diff').write_text(out,encoding='utf-8')
          PY
      - name: Apply patch
        run: |
          test "$(cat /tmp/patch.diff)" != "NO_PATCH"
          git apply --check /tmp/patch.diff
          git apply /tmp/patch.diff
          git diff --check
      - name: Run tests
        run: pytest -q
      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          branch="agent/issue-${ISSUE_NUMBER}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement issue #${ISSUE_NUMBER}"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "feat: ${ISSUE_TITLE}" --body "Implements #${ISSUE_NUMBER}. Automated Groq implementation; pytest passed. Please review before merging."
